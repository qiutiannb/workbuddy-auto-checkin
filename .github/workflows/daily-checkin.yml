name: WorkBuddy Daily Checkin

on:
  schedule:
    # 北京时间 00:05 = UTC 16:05（前一天）。每天一次，不设在整点。
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim daily credits
        env:
          WORKBUDDY_ACCESS_TOKEN: ${{ secrets.WORKBUDDY_ACCESS_TOKEN }}
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
          WORKBUDDY_DOMAIN: ${{ secrets.WORKBUDDY_DOMAIN }}
          WORKBUDDY_ENTERPRISE_ID: ${{ secrets.WORKBUDDY_ENTERPRISE_ID }}
          # 别人也能看到仓库时保持为空。只有自己能看的仓库，想在日志里看账户总额时，把 Actions Variable 设为 1。
          WORKBUDDY_SHOW_BALANCE: ${{ vars.WORKBUDDY_SHOW_BALANCE }}
        run: python scripts/checkin.py
